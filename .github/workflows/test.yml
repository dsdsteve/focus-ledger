name: test
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          # Match the severity used locally; fail only on real issues, not style nits.
          severity: warning

  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ensure dash is installed
        shell: bash
        run: |
          if command -v dash >/dev/null 2>&1; then
            exit 0
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install dash
          else
            sudo apt-get update
            sudo apt-get install -y dash
          fi
      - name: run suite under bash
        shell: bash
        run: |
          set +e
          bash test/run.sh bash 2>&1 | tee /tmp/focus-ledger-bash.log
          rc=${PIPESTATUS[0]}
          set -e
          if [[ $rc -ne 0 ]]; then
            grep 'FAIL' /tmp/focus-ledger-bash.log | sed 's/^/::error::/' || true
          fi
          exit "$rc"
      - name: run suite under dash
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          bash test/run.sh dash 2>&1 | tee /tmp/focus-ledger-dash.log
          rc=${PIPESTATUS[0]}
          set -e
          if [[ $rc -ne 0 ]]; then
            grep 'FAIL' /tmp/focus-ledger-dash.log | sed 's/^/::error::/' || true
          fi
          exit "$rc"
